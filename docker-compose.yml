services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: barcode-shoppinglist-app
    environment:
      ALLOW_NON_NUMERIC_SCANS: "1"
      LOG_LEVEL: "INFO"
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: barcode-shoppinglist-frontend
    depends_on:
      - app
    ports:
      - "5173:80"
    restart: unless-stopped

  frontend-dev:
    profiles:
      - dev
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: barcode-shoppinglist-frontend-dev
    depends_on:
      - app
    environment:
      VITE_API_BASE_URL: "http://localhost:8000"
    ports:
      - "5174:5173"

volumes:
  app_data:
